name: Report a library
description: Tell the maintainers, in public, that a library in the mdBlocks Hub is broken or out of date.
title: "Report: "
labels: [report]
body:
  - type: markdown
    attributes:
      value: |
        Use this public form for a library listed in the mdBlocks Hub that is broken or out of date.

        **Do not use it for malware, copyright, licence, trademark or harassment reports.** Send those privately to [abuse@mdblocks.com](mailto:abuse@mdblocks.com), or use Report abuse on the library's Hub page. To report a vulnerability, use [private vulnerability reporting](https://github.com/mdblocks-labs/hub/security/advisories/new).
  - type: input
    id: entry
    attributes:
      label: Library
      description: Its Hub name, `owner/name`.
      placeholder: example/signal
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Listed commit
      description: The commit the Hub page shows. Filled in when you come from the page.
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      options:
        - Broken
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you saw, and where in the library.
    validations:
      required: true
