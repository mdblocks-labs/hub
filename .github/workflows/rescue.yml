# Rescue forks (hub-repo.md §9): after each merge that lists a commit, keep
# that commit reachable in `mdblocks-hub`, and after each removal delete the
# entry's fork. Uses only the rescue app's token, touches no library tree, and
# opens an issue when a fork, push or deletion fails; neither waits for it.
name: rescue

on:
  push:
    branches: [main]
    paths: ["entries/**"]

permissions:
  contents: read
  issues: write

jobs:
  rescue:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: hub-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          app-id: ${{ secrets.HUB_RESCUE_APP_ID }}
          private-key: ${{ secrets.HUB_RESCUE_APP_KEY }}
          owner: mdblocks-hub
      - name: Fork and tag
        env:
          RESCUE_TOKEN: ${{ steps.token.outputs.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 checks/scripts/rescue.py "$BEFORE" "$AFTER" 2> failures.txt
      - name: Open an issue for a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create -R "${{ github.repository }}" --title "A rescue fork, push or deletion failed" --body-file failures.txt
