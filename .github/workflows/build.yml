# The index build on main (hub-repo.md §6, §10; block-cards.md §8). Records
# come from the published detail files; a listed commit with none is checked
# here, by main's own workflow. The build is unprivileged. Only `upload`, which
# receives the built files as an artifact and runs nothing from them, holds the
# storage keys, in the `hub-publish` environment.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

env:
  # Where the staging bucket's `hub/v3/` is served.
  PUBLISHED: https://mdblocks.com/hub-staging/v3

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      missing: ${{ steps.published.outputs.missing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mdb
        run: checks/scripts/install-tools.sh checks/tools.toml "$RUNNER_TEMP/tools" mdb
      - name: Check the repository
        run: '"$RUNNER_TEMP/tools/bin/mdb" library hub-check .'
      # A record from another tool version is checked again (hub-repo.md §4.1),
      # on every build until a fresh record replaces it.
      - name: Take the published records
        id: published
        run: python3 checks/scripts/published.py fetch . "$PUBLISHED" published >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published
          path: published/
          if-no-files-found: ignore
          retention-days: 7

  check:
    needs: plan
    if: needs.plan.outputs.missing != '[]'
    strategy:
      fail-fast: false
      matrix:
        change: ${{ fromJSON(needs.plan.outputs.missing) }}
    uses: ./.github/workflows/run-checks.yml
    with:
      entry: ${{ matrix.change.entry }}
      source: ${{ matrix.change.source }}
      commit: ${{ matrix.change.commit }}
      previous: ${{ matrix.change.previous }}

  catalog:
    needs: [plan, check]
    if: always() && needs.plan.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.check.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hub
          persist-credentials: false
      - name: Install mdb
        run: hub/checks/scripts/install-tools.sh hub/checks/tools.toml "$RUNNER_TEMP/tools" mdb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published
          path: published
        continue-on-error: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: fresh
          merge-multiple: true
      - name: Combine the records
        run: |
          mkdir -p published fresh
          python3 hub/checks/scripts/published.py combine hub published fresh results | tee notes.txt
      - name: Build the index
        env:
          # The job's own read-only token, sent only to GitHub's API.
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/tools/bin/mdb" library catalog hub out --checks results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hub-index
          path: out/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.txt
          retention-days: 7

  upload:
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: hub-publish
    permissions:
      contents: read
      actions: read
    steps:
      # A rerun of an older build would publish an older index, undoing a delisting.
      - name: Refuse a build of an older main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [ "$tip" = "$GITHUB_SHA" ] || { echo "::error::main is at $tip, and this build is of $GITHUB_SHA"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: checks/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hub-index
          path: out
      - name: Upload to the staging bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HUB_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HUB_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.HUB_R2_ENDPOINT }}
          CF_PURGE_TOKEN: ${{ secrets.HUB_CF_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.HUB_CF_ZONE_ID }}
        run: python3 checks/scripts/publish.py out --bucket mdblocks-hub-staging --public-base "$PUBLISHED"
      - name: Upload to the public bucket
        if: vars.HUB_PUBLIC == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HUB_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HUB_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.HUB_R2_ENDPOINT }}
          CF_PURGE_TOKEN: ${{ secrets.HUB_CF_PURGE_TOKEN }}
          CF_ZONE_ID: ${{ secrets.HUB_CF_ZONE_ID }}
        run: python3 checks/scripts/publish.py out --bucket mdblocks-hub --public-base https://mdblocks.com/hub/v3

  notify:
    needs: catalog
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      # One open issue per commit: a kept record is rechecked on every build.
      - name: Open an issue for a recheck's new flags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s notes.txt ] || exit 0
          while IFS= read -r note; do
            title="A recheck flagged ${note%%:*}"
            if ! gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json title \
              --jq '.[].title' | grep -Fxq "$title"; then
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$note"
            fi
          done < notes.txt
